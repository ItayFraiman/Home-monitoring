global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: controller
    static_configs:
      - targets: ["controller:8000"]

  - job_name: sensor-sim
    static_configs:
      - targets: ["EDGE_HOST_PLACEHOLDER:8001"]

  - job_name: actuator
    static_configs:
      - targets: ["EDGE_HOST_PLACEHOLDER:8002"]